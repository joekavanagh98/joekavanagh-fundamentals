<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculators</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Calculators</h1>
    </header>

    <main>
      <section>
        <h2>Compound Interest Calculator</h2>
        <form id="compound-form">
          <div class="field">
            <label for="principal">Principal ($)</label>
            <input
              id="principal"
              name="principal"
              type="number"
              min="0"
              step="0.01"
              value="1000"
              required
            />
          </div>

          <div class="field">
            <label for="compound-rate">Interest Rate (%)</label>
            <input
              id="compound-rate"
              name="rate"
              type="number"
              min="0"
              step="0.01"
              value="5"
              required
            />
          </div>

          <div class="field">
            <label for="compound-years">Years</label>
            <input
              id="compound-years"
              name="years"
              type="number"
              min="1"
              step="1"
              value="10"
              required
            />
          </div>

          <div class="field">
            <label for="compound-frequency">Compounding Frequency</label>
            <select id="compound-frequency" name="frequency" required>
              <option value="1">Annually</option>
              <option value="2">Semi-annually</option>
              <option value="4">Quarterly</option>
              <option value="12" selected>Monthly</option>
              <option value="26">Bi-weekly</option>
              <option value="52">Weekly</option>
              <option value="365">Daily</option>
            </select>
          </div>

          <div class="buttons">
            <button type="submit">Calculate</button>
            <button type="reset">Reset</button>
          </div>

          <output id="compound-result"></output>
        </form>
      </section>

      <section>
        <h2>Loan Payment Calculator</h2>
        <form id="loan-form">
          <div class="field">
            <label for="loan-principal">Loan Amount ($)</label>
            <input
              id="loan-principal"
              name="principal"
              type="number"
              min="0"
              step="0.01"
              value="20000"
              required
            />
          </div>

          <div class="field">
            <label for="loan-rate">Interest Rate (%)</label>
            <input
              id="loan-rate"
              name="rate"
              type="number"
              min="0"
              step="0.01"
              value="6.5"
              required
            />
          </div>

          <div class="field">
            <label for="loan-years">Years</label>
            <input
              id="loan-years"
              name="years"
              type="number"
              min="1"
              step="1"
              value="5"
              required
            />
          </div>

          <div class="field">
            <label for="loan-frequency">Payment Frequency</label>
            <select id="loan-frequency" name="frequency" required>
              <option value="12" selected>Monthly</option>
              <option value="24">Semi-monthly</option>
              <option value="26">Bi-weekly</option>
              <option value="52">Weekly</option>
            </select>
          </div>

          <div class="buttons">
            <button type="submit">Calculate</button>
            <button type="reset">Reset</button>
          </div>

          <output id="loan-result"></output>
        </form>
      </section>
    </main>
  </body>
</html>
